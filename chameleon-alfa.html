<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chameleon alfa</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f6;--fg:#1d1d1b;--mu:#76736b;--ln:#e6e3dc;--sf:#fff;--ac:#2f6f5e;--ac2:#e3efe9;--bad:#b3402f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161715;--fg:#ecebe6;--mu:#9a978e;--ln:#2b2d2a;--sf:#1e201d;--ac:#6fbfa8;--ac2:#22332e;--bad:#e0806f}}
:root[data-theme="dark"]{--bg:#161715;--fg:#ecebe6;--mu:#9a978e;--ln:#2b2d2a;--sf:#1e201d;--ac:#6fbfa8;--ac2:#22332e;--bad:#e0806f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0}h1{font-size:28px}h2{font-size:22px;margin-bottom:4px}h3{font-size:17px;margin:28px 0 8px}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{padding:20px 14px;border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:2px}
nav .brand{font:600 20px Fraunces,serif;padding:0 8px 12px}nav .sub{color:var(--mu);font-size:12px;padding:0 8px 10px}
nav a{padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--mu)}nav a.on{background:var(--ac2);color:var(--fg);font-weight:600}
nav select{margin:6px 0}
main{padding:28px 32px 90px;max-width:1000px;width:100%}
.mu{color:var(--mu)}.bad{color:var(--bad)}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:7px 10px}
button{cursor:pointer}button.p{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}button.l{border:0;background:none;color:var(--ac);padding:2px 6px}button.l.d{color:var(--bad)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}input,select,textarea{width:100%}input[type=checkbox]{width:auto}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}.bar .sp{flex:1}
.tw{overflow-x:auto;border-top:1px solid var(--ln)}table{border-collapse:collapse;width:100%;font-size:14px}th{text-align:left;color:var(--mu);font-weight:500;font-size:12px}td,th{padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}td.n,th.n{text-align:right}
.note{border-left:3px solid var(--bad);padding:6px 12px;margin:12px 0;background:var(--sf)}.tip{border-left:3px solid var(--ac);padding:4px 12px;margin:8px 0;color:var(--mu)}
.empty{padding:30px 0;color:var(--mu)}.empty b{display:block;color:var(--fg);font-family:Fraunces,serif;font-size:18px;margin-bottom:4px}
.kp{display:flex;flex-wrap:wrap;gap:28px;margin:12px 0}.kp div span{display:block;font-size:12px;color:var(--mu)}.kp div b{font:600 24px Fraunces,serif}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--ac2)}
#modal .mb{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px;z-index:9}
.mc{background:var(--bg);border-radius:10px;padding:22px;width:560px;max-width:100%}.mc .row{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.g2{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:6px;margin-bottom:6px}
#fbb{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:70px;background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:6px;z-index:10}
details{margin:6px 0}summary{cursor:pointer;color:var(--mu);font-size:13px}svg{width:100%;height:auto;display:block}svg text{fill:var(--mu);font-size:11px}
.wel{max-width:560px;margin:8vh auto;padding:0 20px}.opt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.opt button{padding:14px;text-align:left}.opt button.on{border-color:var(--ac);background:var(--ac2);font-weight:600}
@media(max-width:720px){.app{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln);align-items:center}nav .brand,nav .sub{display:none}nav a{white-space:nowrap}nav select{width:auto}main{padding:18px 14px 90px}}
</style></head><body><div id="root"></div><div id="modal"></div><div id="tt"></div>
<script>
const KEY='chameleon_alfa_v1',$=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S)S={seg:null,role:'Administrador',view:'home',per:90,hor:30,theme:'',dbs:{},fb:[],uid:1,w:{seg:'salao',role:'Administrador'}};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const SEG={salao:{n:'Salão de beleza',t:'Salão Aurora',cli:'Cliente',v:'Atendimento',vs:'Atendimentos'},oficina:{n:'Oficina mecânica',t:'Oficina Ponto Certo',cli:'Cliente',v:'Ordem de serviço',vs:'Ordens de serviço'},loja:{n:'Loja de varejo',t:'Loja Estação',cli:'Cliente',v:'Venda',vs:'Vendas'},academia:{n:'Academia',t:'Academia Vigor',cli:'Aluno',v:'Venda',vs:'Vendas'}};
const IT={salao:[['Corte feminino','servico',90,35,0],['Corte masculino','servico',60,20,0],['Coloração','servico',180,70,0],['Escova','servico',70,20,0],['Shampoo profissional','produto',58,30,12],['Máscara hidratante','produto',74,38,8],['Óleo capilar','produto',49,22,5]],
oficina:[['Troca de óleo','servico',120,30,0],['Alinhamento','servico',110,25,0],['Revisão geral','servico',350,120,0],['Filtro de óleo','produto',35,18,20],['Pastilha de freio','produto',180,95,10],['Bateria 60Ah','produto',480,300,4],['Lâmpada de farol','produto',40,20,15]],
loja:[['Camiseta básica','produto',59,25,40],['Calça jeans','produto',159,70,18],['Tênis casual','produto',249,120,9],['Boné','produto',49,18,25],['Meia (par)','produto',19,6,60],['Cinto de couro','produto',79,30,12]],
academia:[['Plano mensal','servico',120,0,0],['Plano trimestral','servico',330,0,0],['Aula avulsa','servico',35,0,0],['Whey 900g','produto',139,85,14],['Garrafa térmica','produto',39,15,20],['Camiseta dry-fit','produto',69,28,10]]};
const T=ds(new Date());
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function add(s,n){const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return ds(d)}
function diff(a,b){return Math.round((new Date(a+'T12:00')-new Date(b+'T12:00'))/864e5)}
const $$=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fd=s=>s?new Date(s).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const fdd=s=>s?s.split('-').reverse().join('/'):'-';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=n=>(n*100).toFixed(0)+'%';
function rec(o,by){o.id=S.uid++;o.cb=by||S.role;o.ca=new Date().toISOString();o.ua=o.ca;return o}
function seed(g){const d={people:[],items:[],sales:[],fin:[],mat:[],pres:[],cfg:{cap:40,min:5}};
['Ana Souza','Bruno Lima','Carla Mendes','Diego Rocha','Elisa Prado'].forEach((n,i)=>d.people.push(rec({nome:n,tipo:'cliente',doc:'123.456.78'+i+'-00',email:n.split(' ')[0].toLowerCase()+'@exemplo.com',tel:'(11) 91234-000'+i,end:'Rua das Flores, '+(10+i)},'Sistema')));
d.people.push(rec({nome:'Distribuidora Central',tipo:'fornecedor',doc:'12.345.678/0001-90',email:'contato@central.com',tel:'(11) 3000-0000',end:'Av. Industrial, 500'},'Sistema'),rec({nome:'Marta Alves',tipo:'funcionario',doc:'987.654.321-00',email:'marta@exemplo.com',tel:'(11) 98888-0000',end:'Rua Verde, 3'},'Sistema'));
IT[g].forEach(r=>d.items.push(rec({nome:r[0],tipo:r[1],desc:'',preco:r[2],custo:r[3],estoque:r[4],un:r[1]=='servico'?'serv.':'un'},'Sistema')));
d.fin.push(rec({desc:'Aluguel do mês',tipo:'despesa',valor:1800,venc:add(T,-5),pago:'',status:'pendente'},'Sistema'),rec({desc:'Energia elétrica',tipo:'despesa',valor:420,venc:add(T,10),pago:'',status:'pendente'},'Sistema'));
if(g=='academia'){const pl=d.items[0].id;[0,1].forEach(i=>{const m=rec({aluno:d.people[i].id,plano:pl,inicio:add(T,-20),status:'ativa'},'Sistema');d.mat.push(m);d.fin.push(rec({desc:'Mensalidade',tipo:'receita',valor:120,venc:add(T,10+i),pago:'',status:'pendente',matId:m.id},'Sistema'))});d.pres.push(rec({aluno:d.people[0].id,data:T},'Sistema'))}
return d}
const db=()=>{if(!S.dbs[S.seg]){S.dbs[S.seg]=seed(S.seg);save()}return S.dbs[S.seg]};
const V=()=>SEG[S.seg];
const nm=(a,id)=>(a.find(x=>x.id==id)||{}).nome||'(removido)';
const ST={pendente:'Pendente',concluida:'Concluída',cancelada:'Cancelada',devolvida:'Devolvida'};
const FS=[['pendente','Pendente'],['concluido','Concluído'],['falhou','Falhou'],['estornado','Estornado']];
const MODS={
people:{t:'Pessoas',add:'Cadastrar pessoa',f:[{k:'nome',l:'Nome',r:1},{k:'tipo',l:'Tipo',r:1,s:()=>[['cliente',V().cli],['fornecedor','Fornecedor'],['funcionario','Funcionário']]},{k:'doc',l:'Documento (CPF ou CNPJ)',r:1},{k:'email',l:'E-mail',e:1},{k:'tel',l:'Telefone'},{k:'end',l:'Endereço'}],c:['nome','tipo','doc','email','tel']},
items:{t:'Itens',add:'Cadastrar item',f:[{k:'nome',l:'Nome',r:1},{k:'tipo',l:'Tipo',r:1,s:()=>[['produto','Produto'],['servico','Serviço']]},{k:'desc',l:'Descrição'},{k:'preco',l:'Preço de venda (R$)',t:'number',r:1},{k:'custo',l:'Custo (R$)',t:'number'},{k:'estoque',l:'Saldo de estoque (só produtos)',t:'number'},{k:'un',l:'Unidade (un, kg, par)'}],c:['nome','tipo','preco','estoque','un']},
fin:{t:'Financeiro',add:'Lançar despesa ou receita',f:[{k:'desc',l:'Descrição',r:1},{k:'tipo',l:'Tipo',r:1,s:()=>[['despesa','Despesa'],['receita','Receita']]},{k:'valor',l:'Valor (R$)',t:'number',r:1},{k:'venc',l:'Vencimento',t:'date',r:1},{k:'pago',l:'Data de pagamento',t:'date'},{k:'status',l:'Status do pagamento',r:1,s:()=>FS}],c:['desc','tipo','valor','venc','pago','status']},
mat:{t:'Matrículas',add:'Matricular aluno',f:[{k:'aluno',l:'Aluno',r:1,s:d=>d.people.filter(p=>p.tipo=='cliente').map(p=>[p.id,p.nome])},{k:'plano',l:'Plano',r:1,s:d=>d.items.filter(i=>i.tipo=='servico').map(p=>[p.id,p.nome])},{k:'inicio',l:'Início',t:'date',r:1},{k:'status',l:'Status',r:1,s:()=>[['pendente','Pendente'],['ativa','Ativa'],['cancelada','Cancelada'],['concluida','Concluída'],['suspensa','Suspensa']]}],c:['aluno','plano','inicio','status']},
pres:{t:'Presenças',add:'Registrar entrada',f:[{k:'aluno',l:'Aluno',r:1,s:d=>d.people.filter(p=>p.tipo=='cliente').map(p=>[p.id,p.nome])},{k:'data',l:'Data',t:'date',r:1}],c:['aluno','data']}};
const COL={nome:'Nome',tipo:'Tipo',doc:'Documento',email:'E-mail',tel:'Telefone',preco:'Preço',estoque:'Estoque',un:'Un.',desc:'Descrição',valor:'Valor',venc:'Vencimento',pago:'Pago em',status:'Status',aluno:'Aluno',plano:'Plano',inicio:'Início',data:'Data'};
function cell(m,r,k){const f=MODS[m].f.find(x=>x.k==k),d=db();let v=r[k];if(f&&f.s){const o=f.s(d).find(x=>x[0]==v);return esc(o?o[1]:'(removido)')}
if(['preco','valor','custo'].includes(k))return $$(v);if(['venc','pago','inicio','data'].includes(k))return fdd(v);if(k=='estoque'&&r.tipo=='servico')return '-';return esc(v)}
const aud=r=>esc(r.cb)+', '+fd(r.ca)+(r.ua!==r.ca?'<br><span class="mu">alterado '+fd(r.ua)+'</span>':'');
const ok=id=>({fin:S.role!='Funcionário',an:S.role!='Funcionário',cfg:S.role=='Administrador',fb:S.role=='Administrador',mat:S.seg=='academia',pres:S.seg=='academia'}[id]!==false);
function toast(m){const e=document.createElement('div');e.id='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}
function modal(h){$('#modal').innerHTML='<div class="mb"><div class="mc">'+h+'</div></div>'}
const closeM=()=>$('#modal').innerHTML='';
function ask(msg,fn){window._ask=fn;modal('<p>'+msg+'</p><div class="row"><button data-a="close">Voltar</button><button class="p" data-a="yes">Confirmar</button></div>')}
function emp(t,s,a,l){return '<div class="empty"><b>'+t+'</b>'+s+(a?'<div class="bar"><button class="p" data-a="'+a+'">'+l+'</button></div>':'')+'</div>'}
function low(){const d=db(),l=d.items.filter(i=>i.tipo=='produto'&&i.estoque<=d.cfg.min);return l.length?'<div class="note"><b>Estoque baixo:</b> '+l.map(i=>esc(i.nome)+' ('+i.estoque+')').join(', ')+'. Reponha antes que falte na hora de vender.</div>':''}
/* ---------- telas ---------- */
function render(){const r=$('#root');
if(!S.seg){r.innerHTML='<div class="wel"><h1>Chameleon</h1><p class="mu">Versão alfa para teste. Escolha um tipo de negócio e um perfil. Nada é enviado a servidor: os dados ficam neste navegador.</p><h3>Tipo de negócio</h3><div class="opt">'+Object.keys(SEG).map(k=>'<button data-a="wseg" data-i="'+k+'" class="'+(S.w.seg==k?'on':'')+'">'+SEG[k].n+'</button>').join('')+'</div><h3>Perfil</h3><div class="opt">'+['Administrador','Gerente','Funcionário'].map(k=>'<button data-a="wrole" data-i="'+k+'" class="'+(S.w.role==k?'on':'')+'">'+k+'</button>').join('')+'</div><div class="bar"><button class="p" data-a="enter">Entrar</button></div></div>';return}
if(!ok(S.view))S.view='home';
const nav=[['home','Início'],['sales',V().vs],['people','Pessoas'],['items','Itens'],['mat','Matrículas'],['pres','Presenças'],['fin','Financeiro'],['an','Análises'],['cfg','Configurações'],['fb','Feedback recebido']].filter(n=>ok(n[0]));
r.innerHTML='<div class="app"><nav><div class="brand">Chameleon</div><div class="sub">'+esc(V().t)+'</div>'+nav.map(n=>'<a data-a="view" data-i="'+n[0]+'" class="'+(S.view==n[0]?'on':'')+'">'+n[1]+'</a>').join('')+'<select data-c="seg" aria-label="Segmento">'+Object.keys(SEG).map(k=>'<option value="'+k+'"'+(k==S.seg?' selected':'')+'>'+SEG[k].n+'</option>').join('')+'</select><select data-c="role" aria-label="Perfil">'+['Administrador','Gerente','Funcionário'].map(k=>'<option'+(k==S.role?' selected':'')+'>'+k+'</option>').join('')+'</select><button data-a="theme">Claro ou escuro</button><button class="l" data-a="reset">Restaurar dados de demonstração</button></nav><main>'+view()+'</main></div><button id="fbb" data-a="fbo">Enviar feedback</button>'}
function view(){const v=S.view;return v=='home'?home():v=='sales'?sales():v=='fin'?fin():v=='an'?an():v=='cfg'?cfg():v=='fb'?fbv():crud(v)}
function home(){const d=db(),done=d.sales.filter(s=>s.status=='concluida').length;
return '<h1>'+esc(V().t)+'</h1><p class="mu">Perfil: '+S.role+'. Comece por aqui:</p>'+low()+'<div class="kp"><div><span>Pessoas</span><b>'+d.people.length+'</b></div><div><span>Itens</span><b>'+d.items.length+'</b></div><div><span>'+V().vs+' concluídos</span><b>'+done+'</b></div></div><div class="bar"><button class="p" data-a="sale">Registrar '+V().v.toLowerCase()+'</button>'+(ok('an')?'<button data-a="view" data-i="an">Ver análises</button>':'')+'</div>'+(done?'':'<p class="tip">Ainda não há '+V().vs.toLowerCase()+'. Registre uma, ou use Gerar dados de simulação em Análises para ver os gráficos cheios.</p>')}
function crud(m){const M=MODS[m],d=db(),rows=d[m].slice().reverse();
return '<h2>'+M.t+'</h2>'+(m=='items'?low():'')+'<div class="bar"><button class="p" data-a="add" data-i="'+m+'">'+M.add+'</button></div>'+(rows.length?'<div class="tw"><table><tr>'+M.c.map(k=>'<th>'+(COL[k]||k)+'</th>').join('')+'<th>Auditoria</th><th></th></tr>'+rows.map(r=>'<tr>'+M.c.map(k=>'<td'+(['preco','estoque'].includes(k)?' class="n"':'')+'>'+cell(m,r,k)+'</td>').join('')+'<td>'+aud(r)+'</td><td><button class="l" data-a="edit" data-i="'+m+':'+r.id+'">Editar</button><button class="l d" data-a="del" data-i="'+m+':'+r.id+'">Remover</button></td></tr>').join('')+'</table></div>':emp('Nada cadastrado ainda','Use o botão acima para criar o primeiro registro.'))}
function form(m,id){const M=MODS[m],d=db(),r=id?d[m].find(x=>x.id==id):{data:T,inicio:T,venc:T,status:m=='fin'?'pendente':'ativa',tipo:m=='fin'?'despesa':m=='items'?'servico':'cliente'};
modal('<h2>'+(id?'Editar':M.add)+'</h2><form data-f="'+m+':'+(id||'')+'" novalidate>'+M.f.map(f=>'<label>'+f.l+(f.r?' *':'')+'</label>'+(f.s?'<select name="'+f.k+'">'+(f.r?'':'<option value=""></option>')+f.s(d).map(o=>'<option value="'+o[0]+'"'+(o[0]==r[f.k]?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>':'<input name="'+f.k+'" type="'+(f.t||'text')+'" '+(f.t=='number'?'step="0.01" min="0" ':'')+'value="'+esc(r[f.k]||(f.t=='number'?0:''))+'">')).join('')+'<p class="bad" id="err"></p><div class="row"><button type="button" data-a="close">Cancelar</button><button class="p">Salvar</button></div></form>')}
function saveForm(m,id,fm){const M=MODS[m],d=db(),o={};
for(const f of M.f){let v=(fm.elements[f.k].value||'').trim();if(f.r&&!v)return '"'+f.l+'" é obrigatório. Preencha o campo para continuar.';
if(f.t=='number'){v=parseFloat(v);if(isNaN(v)||v<0)return '"'+f.l+'" precisa ser um número maior ou igual a zero.'}
if(f.e&&v&&!/^\S+@\S+\.\S+$/.test(v))return 'O e-mail parece incompleto. Exemplo: nome@empresa.com.';o[f.k]=v}
if(m=='items'&&o.tipo=='servico')o.estoque=0;if(m=='items'&&!o.un)o.un=o.tipo=='servico'?'serv.':'un';
if(m=='fin'){if(o.status=='concluido'&&!o.pago)o.pago=T;if(o.pago&&o.status=='pendente')o.status='concluido'}
if(['aluno','plano'].some(k=>o[k]))['aluno','plano'].forEach(k=>{if(o[k])o[k]=+o[k]});
if(id){const r=d[m].find(x=>x.id==id);Object.assign(r,o);r.ua=new Date().toISOString()}else d[m].push(rec(o));
if(m=='mat')charge(d,id?d[m].find(x=>x.id==id):d[m][d[m].length-1]);save();closeM();render();toast('Salvo com sucesso.');return ''}
function charge(d,mt){const p=d.items.find(i=>i.id==mt.plano);if(mt.status!='ativa'){d.fin=d.fin.filter(f=>!(f.matId==mt.id&&f.status=='pendente'));return}
if(!d.fin.some(f=>f.matId==mt.id&&f.status=='pendente'))d.fin.push(rec({desc:'Mensalidade',tipo:'receita',valor:p?p.preco:0,venc:add(T,30),pago:'',status:'pendente',matId:mt.id}))}
/* ---------- vendas ---------- */
let SL;
function sales(){const d=db(),rows=d.sales.slice().reverse();

function readSale(){const q=s=>[...document.querySelectorAll(s)];SL={cli:$('#sc').value,date:$('#sd').value,hora:$('#sh').value,gd:+$('#sg').value||0,pay:$('#sp').value,status:$('#ss').value,lines:q('.li').map((e,i)=>({item:e.value,q:+q('.lq')[i].value||0,d:+q('.ld')[i].value||0}))}}

function calc(){readSale();const d=db();let br=0,it=0;SL.lines.forEach(l=>{const t=d.items.find(i=>i.id==l.item);if(t){br+=t.preco*l.q;it+=t.preco*l.q*l.d/100}});const sb=br-it,tt=sb*(1-SL.gd/100);$('#tot').innerHTML='Subtotal: '+$$(br)+'<br>Descontos dos itens: -'+$$(it)+'<br>Desconto geral: -'+$$(sb-tt)+'<br>Total: '+$$(tt)}
function need(ls,d){const m={};ls.forEach(l=>m[l.item]=(m[l.item]||0)+l.q);for(const id in m){const t=d.items.find(i=>i.id==id);if(t&&t.tipo=='produto'&&t.estoque<m[id])return 'Saldo insuficiente de "'+t.nome+'": há '+t.estoque+' em estoque e a venda pede '+m[id]+'. Reduza a quantidade ou reponha o item em Itens.'}return ''}
function conclude(s,d){s.lines.forEach(l=>{const t=d.items.find(i=>i.id==l.item);if(t&&t.tipo=='produto')t.estoque-=l.q});s.status='concluida';d.fin.push(rec({desc:V().v+' #'+s.num,tipo:'receita',valor:s.total,venc:T,pago:T,status:'concluido',saleId:s.id}))}
function saleSave(){readSale();const d=db(),ls=SL.lines.filter(l=>l.item);
const e=m=>{$('#err').textContent=m};if(!SL.date)return e('Informe a data.');if(SL.date>T&&SL.status=='concluida')return e('Para uma data futura, escolha o status Pendente (agendado) e conclua no dia.');if(!ls.length)return e('Adicione ao menos um item à venda.');
if(ls.some(l=>l.q<1||l.q%1))return e('A quantidade de cada item precisa ser um número inteiro maior que zero.');if(ls.some(l=>l.d<0||l.d>100)||SL.gd<0||SL.gd>100)return e('Descontos devem ficar entre 0 e 100%.');
if(SL.status=='concluida'){const m=need(ls,d);if(m)return e(m)}
const s=rec({num:d.sales.reduce((a,x)=>Math.max(a,x.num),0)+1,cli:SL.cli?+SL.cli:'',pay:SL.pay,gd:SL.gd,date:SL.date,hora:SL.hora,status:'pendente',lines:ls.map(l=>{const t=d.items.find(i=>i.id==l.item);return {item:t.id,nome:t.nome,q:l.q,p:t.preco,c:t.custo||0,d:l.d}}),total:0});
s.total=sum(ls,SL.gd);d.sales.push(s);if(SL.status=='concluida')conclude(s,d);save();closeM();render();toast('Registrado. Estoque e financeiro atualizados.')}

function hbar(rows,fmt){if(!rows.length)return '';const mx=Math.max(...rows.map(r=>r.v),1);return '<svg viewBox="0 0 600 '+(rows.length*26+6)+'" role="img">'+rows.map((r,i)=>'<g><title>'+esc(r.l)+': '+fmt(r.v)+'</title><text x="0" y="'+(i*26+17)+'">'+esc(r.l.slice(0,24))+'</text><rect x="170" y="'+(i*26+4)+'" width="'+Math.max(2,r.v/mx*340)+'" height="16" rx="3" fill="var(--ac)"/><text x="'+(176+r.v/mx*340)+'" y="'+(i*26+17)+'">'+fmt(r.v)+'</text></g>').join('')+'</svg>'}

const bd=f.length?'<polygon fill="var(--ac)" opacity=".15" points="'+f.map((p,i)=>x(k+1+i)+','+y(p.hi)).join(' ')+' '+f.map((p,i)=>x(k+f.length-i)+','+y(f[f.length-1-i].lo)).join(' ')+'"/>':'';

const tab=(h,rows)=>'<details><summary>Ver dados do gráfico</summary><div class="tw"><table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</table></div></details>';
function an(){const d=db(),p=S.per,inP=(s,a,b)=>s.status=='concluida'&&s.date>add(T,-a)&&s.date<=add(T,-b),cur=d.sales.filter(s=>inP(s,p,0)),prev=d.sales.filter(s=>inP(s,2*p,p));
const ag=a=>{const f=a.reduce((x,s)=>x+s.total,0),c=a.reduce((x,s)=>x+s.lines.reduce((y,l)=>y+l.c*l.q*(1-s.gd/100)*(1-l.d/100),0),0);return {f,t:a.length?f/a.length:0,m:f?(f-c)/f:0,n:a.length}};
const A=ag(cur),B=ag(prev),dl=(a,b)=>b?((a-b)/b>=0?'+':'')+((a-b)/b*100).toFixed(0)+'% vs período anterior':'sem período anterior';

if(!d.sales.some(s=>s.status=='concluida'))return h+emp('Ainda não há o que analisar','Registre '+V().vs.toLowerCase()+' ou clique em Gerar dados de simulação para criar seis meses de histórico.');
h+='<h3>Resumo executivo</h3><div class="kp"><div><span>Faturamento</span><b>'+$$(A.f)+'</b><span>'+dl(A.f,B.f)+'</span></div><div><span>Ticket médio</span><b>'+$$(A.t)+'</b><span>'+dl(A.t,B.t)+'</span></div><div><span>Margem aproximada</span><b>'+pct(A.m)+'</b><span>'+(B.n?'antes: '+pct(B.m):'sem período anterior')+'</span></div><div><span>Inadimplência</span><b>'+$$(over)+'</b><span>receitas vencidas</span></div>'+(S.seg=='academia'?'<div><span>Ocupação</span><b>'+pct(d.mat.filter(m=>m.status=='ativa').length/d.cfg.cap)+'</b><span>matrículas ativas / capacidade '+d.cfg.cap+'</span></div>':'')+(S.seg=='oficina'?'<div><span>Ordens abertas</span><b>'+d.sales.filter(s=>s.status=='pendente').length+'</b><span>pendentes</span></div>':'')+'</div><p class="tip">'+(A.f<B.f?'O faturamento caiu. Veja os clientes em risco abaixo e entre em contato com eles.':'O faturamento está estável ou subindo. Aproveite para repor os itens em risco.')+'</p>';
/* ruptura */
const o30=d.sales.filter(s=>inP(s,30,0)),R=d.items.filter(i=>i.tipo=='produto').map(i=>{const q=o30.reduce((a,s)=>a+s.lines.filter(l=>l.item==i.id).reduce((x,l)=>x+l.q,0),0),r=q/30;return {i,q,r,dias:r?i.estoque/r:Infinity}}).sort((a,b)=>a.dias-b.dias),risk=R.filter(x=>x.dias<=30);
h+='<h3>Previsão de ruptura de estoque</h3>'+(risk.length?hbar(risk.map(x=>({l:x.i.nome,v:x.dias})),v=>v.toFixed(0)+' dias'):'<p class="mu">Nenhum item deve acabar nos próximos 30 dias.</p>')+'<p class="tip">'+(risk.length?'Compre "'+esc(risk[0].i.nome)+'" já: no ritmo atual acaba em '+risk[0].dias.toFixed(0)+' dia(s).':'Estoque confortável. Reveja o que não gira para não imobilizar dinheiro.')+'</p>'+tab(['Item','Saldo','Saídas em 30 dias','Saída por dia','Dias restantes'],R.map(x=>[esc(x.i.nome),x.i.estoque,x.q,x.r.toFixed(2),x.dias==Infinity?'sem giro':x.dias.toFixed(1)]));
/* complementares */
const C={},P={};cur.forEach(s=>{const u=[...new Set(s.lines.map(l=>l.item))];u.forEach(a=>C[a]=(C[a]||0)+1);u.forEach(a=>u.forEach(b=>{if(a<b){const k=a+'-'+b;P[k]=(P[k]||0)+1}}))});
const PR=Object.keys(P).map(k=>{const[a,b]=k.split('-').map(Number),x=P[k]/C[a],y=P[k]/C[b];return x>=y?{a,b,n:P[k],c:x}:{a:b,b:a,n:P[k],c:y}}).filter(r=>r.n>=2).sort((a,b)=>b.n-a.n).slice(0,6);
h+='<h3>Produtos complementares</h3>'+(PR.length?hbar(PR.map(r=>({l:nm(d.items,r.a)+' + '+nm(d.items,r.b),v:r.n})),v=>v+' vezes')+'<p class="tip">Quem leva '+esc(nm(d.items,PR[0].a))+' costuma levar '+esc(nm(d.items,PR[0].b))+' ('+pct(PR[0].c)+' das vezes). Ofereça os dois juntos no balcão.</p>'+tab(['Item','Costuma levar','Juntos','Força (confiança)'],PR.map(r=>[esc(nm(d.items,r.a)),esc(nm(d.items,r.b)),r.n,pct(r.c)])):'<p class="mu">Poucas vendas com mais de um item. Registre vendas com itens combinados para ver relações.</p>');
/* caixa */
const W=[],hist=Array(12).fill(0);d.fin.filter(f=>f.status=='concluido'&&f.pago).forEach(f=>{const k=Math.floor(diff(T,f.pago)/7);if(k>=0&&k<12)hist[11-k]+=f.tipo=='receita'?f.valor:-f.valor});
const mean=hist.reduce((a,b)=>a+b,0)/12,sd=Math.sqrt(hist.reduce((a,b)=>a+(b-mean)**2,0)/12),wom=i=>Math.min(3,Math.floor((new Date(add(T,-7*(11-i))+'T12:00').getDate()-1)/7)),se=[0,1,2,3].map(w=>{const a=hist.filter((_,i)=>wom(i)==w);return a.length&&mean?a.reduce((x,y)=>x+y,0)/a.length/mean:1});
const nf=Math.round(S.hor/7),PJ=hist.map((v,i)=>({l:'Semana -'+(11-i),v})).concat(Array.from({length:nf},(_,i)=>{const w=Math.min(3,Math.floor((new Date(add(T,7*(i+1))+'T12:00').getDate()-1)/7)),v=mean*se[w];return {l:'Semana +'+(i+1),v,lo:v-sd,hi:v+sd,f:1}}));

return h}
function sim(){const d=db(),cl=d.people.filter(p=>p.tipo=='cliente'),it=d.items;if(!cl.length||!it.length)return toast('Cadastre ao menos um cliente e um item antes de simular.');
let n=d.sales.reduce((a,s)=>Math.max(a,s.num),0);
for(let k=180;k>=1;k--){const dt=add(T,-k),w=new Date(dt+'T12:00'),dow=w.getDay(),dom=w.getDate();let lam=1+(dow==6?1.2:0)-(dow==0?.6:0)+(dom>25||dom<4?.8:0)+(k<60?.4:0);if(Math.random()<.04)lam*=3;let c=Math.floor(lam+Math.random()*1.5);
while(c-->0){const cu=cl[Math.floor(Math.pow(Math.random(),1.8)*cl.length)],a=Math.floor(Math.pow(Math.random(),1.5)*it.length),ids=[a];if(Math.random()<.5)ids.push((a+1)%it.length);
const s=rec({num:++n,cli:cu.id,pay:['pix','credito','debito','dinheiro'][Math.floor(Math.random()*4)],gd:0,date:dt,status:'concluida',lines:ids.map(i=>({item:it[i].id,nome:it[i].nome,q:1+Math.floor(Math.random()*2),p:it[i].preco,c:it[i].custo||0,d:0}))},'Simulação');s.total=sum(s.lines,0);const r=Math.random();if(r>.95)s.status='devolvida';else if(r>.9)s.status='cancelada';d.sales.push(s);
if(s.status=='concluida'){const late=Math.random()<.06;d.fin.push(rec({desc:V().v+' #'+s.num,tipo:'receita',valor:s.total,venc:late?add(dt,15):dt,pago:late?'':dt,status:late?'pendente':'concluido',saleId:s.id},'Simulação'))}}}
for(let m=0;m<6;m++){d.fin.push(rec({desc:'Aluguel',tipo:'despesa',valor:1800,venc:add(T,-30*m-3),pago:add(T,-30*m-3),status:'concluido'},'Simulação'),rec({desc:'Fornecedores',tipo:'despesa',valor:Math.round(800+Math.random()*700),venc:add(T,-30*m-12),pago:add(T,-30*m-12),status:'concluido'},'Simulação'))}
save();render();toast('Simulação gerada: seis meses de vendas e despesas.')}
function cfg(){const d=db();return '<h2>Configurações do negócio</h2><form data-f="cfg"><label>Nome do negócio</label><input name="t" value="'+esc(V().t)+'"><label>Alerta de estoque baixo (quantidade)</label><input name="min" type="number" min="0" value="'+d.cfg.min+'">'+(S.seg=='academia'?'<label>Capacidade da academia (alunos)</label><input name="cap" type="number" min="1" value="'+d.cfg.cap+'">':'')+'<div class="bar"><button class="p">Salvar configurações</button></div></form>'}
/* ---------- feedback ---------- */
function fbo(){modal('<h2>Enviar feedback</h2><form data-f="fb"><label>Tela atual</label><input name="tela" value="'+esc(S.seg?S.view:'inicio')+'" readonly><label>O que você tentou fazer? *</label><textarea name="a" rows="2"></textarea><label>O que aconteceu? *</label><textarea name="b" rows="2"></textarea><label>Nota de 1 a 5</label><select name="n">'+[5,4,3,2,1].map(n=>'<option>'+n+'</option>').join('')+'</select><p class="bad" id="err"></p><div class="row"><button type="button" data-a="close">Cancelar</button><button class="p">Enviar</button></div></form>')}
function fbv(){const csv='data;segmento;perfil;tela;tentou;aconteceu;nota\n'+S.fb.map(f=>[f.d,f.seg,f.role,f.tela,f.a,f.b,f.n].map(x=>'"'+String(x).replace(/"/g,'""').replace(/\n/g,' ')+'"').join(';')).join('\n');
return '<h2>Feedback recebido</h2><p class="mu">Os envios ficam neste navegador. Para juntar os de várias pessoas, cada testador copia o CSV abaixo e envia a você.</p>'+(S.fb.length?'<div class="tw"><table><tr><th>Data</th><th>Tela</th><th>Tentou</th><th>Aconteceu</th><th>Nota</th></tr>'+S.fb.map(f=>'<tr><td>'+fdd(f.d)+'</td><td>'+esc(f.tela)+'</td><td>'+esc(f.a)+'</td><td>'+esc(f.b)+'</td><td>'+f.n+'</td></tr>').join('')+'</table></div><h3>CSV</h3><textarea rows="5" readonly>'+esc(csv)+'</textarea><div class="bar"><button data-a="copy">Copiar CSV</button></div>':emp('Nenhum feedback ainda','Use o botão Enviar feedback, no canto da tela.'))}
/* ---------- eventos ---------- */
const A={wseg:i=>{S.w.seg=i;render()},wrole:i=>{S.w.role=i;render()},enter:()=>{S.seg=S.w.seg;S.role=S.w.role;S.view='home';save();render()},view:i=>{S.view=i;save();render();scrollTo(0,0)},theme:()=>{const c=document.documentElement,dk=c.dataset.theme=='dark'||(!c.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);c.dataset.theme=dk?'light':'dark'},close:closeM,yes:()=>{const f=window._ask;closeM();f&&f()},
add:i=>form(i),edit:i=>{const[m,id]=i.split(':');form(m,id)},del:i=>{const[m,id]=i.split(':');ask('Remover este registro? Essa ação não pode ser desfeita.',()=>{const d=db();const r=d[m].find(x=>x.id==id);if(m=='fin'&&r.saleId)return toast('Esse lançamento pertence a uma venda. Cancele a venda para estornar.');d[m]=d[m].filter(x=>x.id!=id);if(m=='mat')d.fin=d.fin.filter(f=>!(f.matId==id&&f.status=='pendente'));save();render();toast('Registro removido.')})},
sale:()=>{SL={cli:'',pay:'pix',status:'concluida',gd:0,date:T,hora:'',lines:[{item:'',q:1,d:0}]};saleForm()},addl:()=>{readSale();SL.lines.push({item:'',q:1,d:0});saleForm()},rml:i=>{readSale();SL.lines.splice(i,1);if(!SL.lines.length)SL.lines.push({item:'',q:1,d:0});saleForm()},ssave:saleSave,
stt:i=>{const[id,to]=i.split(':');ask(to=='concluida'?'Concluir este registro? O estoque será baixado.':'Confirmar? O estoque e o financeiro serão estornados.',()=>setStatus(+id,to))},
pay:i=>{const f=db().fin.find(x=>x.id==i);f.status='concluido';f.pago=T;f.ua=new Date().toISOString();if(f.matId){const m=db().mat.find(x=>x.id==f.matId);if(m)charge(db(),m)}save();render();toast('Pagamento registrado.')},
sim,clr:()=>ask('Apagar pessoas, itens, vendas e lançamentos deste segmento e começar do zero?',()=>{const d=db();d.people=[];d.items=[];d.sales=[];d.fin=[];d.mat=[];d.pres=[];save();render()}),
reset:()=>ask('Restaurar os dados de demonstração de todos os segmentos? Seu trabalho será perdido, exceto os feedbacks.',()=>{S.dbs={};save();render();toast('Dados de demonstração restaurados.')}),
fbo,copy:()=>{try{navigator.clipboard.writeText($('textarea').value);toast('CSV copiado.')}catch(e){$('textarea').select();toast('Selecione o texto e copie manualmente.')}}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.i)});
document.addEventListener('input',e=>{if(e.target.closest('[data-sale]'))calc()});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(!c)return;if(c=='seg'){S.seg=e.target.value}else if(c=='role')S.role=e.target.value;else S[c]=+e.target.value;save();render()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.f;if(!k)return;
if(k=='fb'){if(!f.a.value.trim()||!f.b.value.trim())return $('#err').textContent='Conte o que tentou fazer e o que aconteceu.';S.fb.push({d:new Date().toISOString(),seg:S.seg,role:S.role,tela:f.tela.value,a:f.a.value,b:f.b.value,n:f.n.value});save();closeM();return toast('Obrigado pelo feedback.')}
if(k=='cfg'){const d=db();if(f.t.value.trim())SEG[S.seg].t=f.t.value.trim();d.cfg.min=+f.min.value||0;if(f.cap)d.cfg.cap=+f.cap.value||1;d.t=SEG[S.seg].t;save();render();return toast('Configurações salvas.')}
const[m,id]=k.split(':'),er=saveForm(m,id,f);if(er)$('#err').textContent=er});
Object.keys(S.dbs).forEach(k=>{if(S.dbs[k].t)SEG[k].t=S.dbs[k].t});
render();
</script></body></html>
